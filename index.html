<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>每日计划打卡</title>
  <style>
    :root {
      --canvas: #f4f3ee;
      --surface: #ffffff;
      --surface-muted: #f7f7f3;
      --surface-blue: #eef4f6;
      --ink: #17384e;
      --ink-soft: #5f707a;
      --ink-faint: #89949a;
      --line: #d9ddda;
      --line-strong: #c8d0cd;
      --accent: #3e708b;
      --accent-deep: #214b65;
      --accent-soft: #dfeaf0;
      --yellow: #e7e2ab;
      --yellow-soft: #f3efcc;
      --blue-soft: #dfeaf0;
      --rose-soft: #f1ded7;
      --success: #4f7d61;
      --success-soft: #e4eee7;
      --danger: #a94f48;
      --danger-soft: #f6e8e5;
      --shadow-panel: 0 14px 38px rgba(23, 56, 78, 0.055);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background-color: var(--canvas);
      background-image:
        linear-gradient(rgba(23, 56, 78, 0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 56, 78, 0.026) 1px, transparent 1px);
      background-size: 32px 32px;
      font-family: "Segoe UI Variable Text", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-feature-settings: "kern" 1, "tnum" 1;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button,
    label[for] {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible,
    label.button:focus-within {
      outline: 3px solid rgba(62, 112, 139, 0.24);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .page-glow {
      display: none;
    }

    .app-shell {
      width: min(calc(100% - 40px), 1080px);
      margin: 0 auto;
      padding: 44px 0 32px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(26px, 3.8vw, 38px);
      border: 1px solid rgba(52, 67, 64, 0.2);
      border-radius: var(--radius-xl);
      background: var(--yellow);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.44);
    }

    .hero::before,
    .hero::after {
      display: none;
    }

    .hero__top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(78px, 8vw, 108px);
    }

    .hero__copy {
      min-width: 0;
      max-width: 620px;
      flex: 1 1 auto;
    }

    .eyebrow {
      margin: 0 0 11px;
      color: var(--accent-deep);
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      font-size: 0.76rem;
      font-weight: 650;
      letter-spacing: 0.055em;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(2.8rem, 5.15vw, 4.15rem);
      font-weight: 760;
      letter-spacing: -0.055em;
      line-height: 1.02;
    }

    .hero__subtitle {
      max-width: 30rem;
      margin-bottom: 0;
      color: #526972;
      font-size: 0.96rem;
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      flex: 0 0 auto;
      gap: 9px;
    }

    .hero .toolbar {
      flex-wrap: wrap;
      margin-top: 27px;
    }

    .button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 15px;
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      transition: color 150ms ease, background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }

    .button:hover {
      border-color: var(--line-strong);
    }

    .button svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    .button--ghost {
      color: var(--accent-deep);
      border-color: rgba(33, 75, 101, 0.15);
      background: rgba(255, 255, 255, 0.62);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .button--ghost:hover {
      background: #fff;
      border-color: rgba(33, 75, 101, 0.26);
    }

    .button--primary {
      color: #fff;
      border-color: var(--accent-deep);
      background: var(--accent-deep);
      box-shadow: 0 4px 12px rgba(33, 75, 101, 0.16);
    }

    .button--primary:hover {
      background: #183e56;
      border-color: #183e56;
    }

    .button--danger {
      color: #fff;
      border-color: var(--danger);
      background: var(--danger);
    }

    .button--danger:hover {
      background: #93423c;
      border-color: #93423c;
    }

    .file-button {
      position: relative;
      overflow: hidden;
    }

    .portrait-card {
      position: relative;
      width: 220px;
      flex: 0 0 220px;
      border: 0;
      background: transparent;
    }

    .portrait-card__badge {
      position: absolute;
      z-index: 2;
      top: 2px;
      left: 0;
      padding: 6px 9px;
      border: 1px solid rgba(33, 75, 101, 0.16);
      border-radius: 6px;
      color: var(--accent-deep);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 5px 14px rgba(42, 62, 71, 0.055);
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .portrait-card__image {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: contain;
      object-position: center bottom;
      background: transparent;
      filter: contrast(1.03) saturate(1.015);
      transform: translateZ(0);
    }

    .portrait-card__footer {
      display: flex;
      width: max-content;
      align-items: center;
      gap: 8px;
      margin: 8px auto 0;
      padding: 7px 11px;
      border: 1px solid rgba(33, 75, 101, 0.13);
      border-radius: 7px;
      color: #405d6c;
      background: rgba(255, 255, 255, 0.68);
      font-size: 0.73rem;
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
    }

    .portrait-card__dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(79, 125, 97, 0.12);
    }

    .summary-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      margin-top: 30px;
      overflow: hidden;
      border: 1px solid rgba(33, 75, 101, 0.14);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.64);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.48);
    }

    .summary-item {
      position: relative;
      min-width: 0;
      padding: 18px 19px 16px;
      text-align: left;
    }

    .summary-item::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 3px;
      content: "";
    }

    .summary-item:nth-child(1) {
      background: rgba(243, 239, 204, 0.76);
    }

    .summary-item:nth-child(1)::before {
      background: #b9ad61;
    }

    .summary-item:nth-child(2) {
      background: rgba(223, 234, 240, 0.84);
    }

    .summary-item:nth-child(2)::before {
      background: #6d99ae;
    }

    .summary-item:nth-child(3) {
      background: rgba(241, 222, 215, 0.82);
    }

    .summary-item:nth-child(3)::before {
      background: #bd7e70;
    }

    .summary-item + .summary-item {
      border-left: 1px solid rgba(33, 75, 101, 0.11);
    }

    .summary-label {
      margin-bottom: 8px;
      color: #526a78;
      font-size: 0.7rem;
      font-weight: 750;
      letter-spacing: 0.055em;
    }

    .summary-value {
      display: block;
      overflow: hidden;
      margin: 0;
      color: var(--accent-deep);
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      font-size: clamp(1.35rem, 2.7vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-value small {
      color: #697b84;
      font-size: 0.72em;
      font-weight: 600;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-panel);
    }

    .today-card {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 3.6vw, 34px);
    }

    .today-card::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 4px;
      content: "";
      background: linear-gradient(90deg, var(--accent-deep) 0 22%, var(--blue-soft) 22% 62%, var(--rose-soft) 62% 100%);
    }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
    }

    .section-kicker {
      margin-bottom: 7px;
      color: var(--accent);
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.11em;
    }

    h2 {
      margin-bottom: 0;
      font-size: clamp(1.2rem, 2.2vw, 1.52rem);
      font-weight: 750;
      letter-spacing: -0.035em;
    }

    .progress-percent {
      color: var(--accent-deep);
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      font-size: clamp(1.9rem, 4vw, 2.65rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .progress-wrap {
      margin-top: 22px;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 4px;
      background: #e7ebe8;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6e9aad, var(--accent-deep));
      transition: width 240ms ease;
    }

    .progress-caption {
      margin: 9px 0 0;
      color: var(--ink-soft);
      font-size: 0.81rem;
    }

    .add-task-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin: 24px 0 18px;
    }

    .input-shell {
      display: flex;
      min-width: 0;
      min-height: 48px;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .input-shell:focus-within {
      border-color: rgba(62, 112, 139, 0.65);
      box-shadow: 0 0 0 3px rgba(62, 112, 139, 0.09);
    }

    .input-shell svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--ink-faint);
    }

    .input-shell input {
      width: 100%;
      min-width: 0;
      height: 46px;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 0.92rem;
    }

    .input-shell input::placeholder {
      color: #99a2a5;
    }

    .task-list {
      display: grid;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 13px;
      min-height: 58px;
      padding: 10px 5px;
      border-top: 1px solid #e4e7e4;
      transition: background 150ms ease;
    }

    .task-item:hover {
      background: #fafaf7;
    }

    .task-check {
      position: relative;
      display: inline-flex;
      width: 26px;
      height: 26px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .task-checkbox {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .task-checkmark {
      position: relative;
      display: block;
      width: 22px;
      height: 22px;
      border: 1.5px solid #adb7b3;
      border-radius: 6px;
      background: #fff;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .task-checkbox:checked + .task-checkmark {
      border-color: var(--success);
      background: var(--success);
    }

    .task-checkbox:checked + .task-checkmark::after {
      position: absolute;
      top: 3px;
      left: 6px;
      width: 6px;
      height: 10px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      content: "";
      transform: rotate(45deg);
    }

    .task-checkbox:focus-visible + .task-checkmark {
      outline: 3px solid rgba(79, 125, 97, 0.18);
      outline-offset: 3px;
    }

    .task-text {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .task-item.is-completed .task-text {
      color: var(--ink-faint);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .task-actions {
      display: flex;
      gap: 3px;
      opacity: 0.38;
      transition: opacity 150ms ease;
    }

    .task-item:hover .task-actions,
    .task-actions:focus-within {
      opacity: 1;
    }

    .icon-button {
      display: inline-grid;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--ink-soft);
      background: transparent;
      cursor: pointer;
      transition: color 150ms ease, background 150ms ease, border-color 150ms ease;
    }

    .icon-button:hover {
      color: var(--ink);
      border-color: var(--line);
      background: #fff;
    }

    .icon-button--danger:hover {
      color: var(--danger);
      border-color: #ecd3cf;
      background: var(--danger-soft);
    }

    .icon-button svg {
      width: 17px;
      height: 17px;
    }

    .task-edit-input {
      width: 100%;
      min-width: 0;
      padding: 9px 11px;
      border: 1px solid rgba(62, 112, 139, 0.55);
      border-radius: 8px;
      outline: 0;
      color: var(--ink);
      background: #fff;
      font-size: 0.94rem;
      box-shadow: 0 0 0 3px rgba(62, 112, 139, 0.08);
    }

    .empty-state {
      display: grid;
      min-height: 138px;
      place-items: center;
      padding: 26px;
      border: 1px dashed #cfd6d2;
      border-radius: 12px;
      color: var(--ink-faint);
      background: #fafaf7;
      text-align: center;
    }

    .empty-state__icon {
      display: grid;
      width: 40px;
      height: 40px;
      margin: 0 auto 10px;
      place-items: center;
      border: 1px solid #d2e0e5;
      border-radius: 10px;
      color: var(--accent);
      background: var(--surface-blue);
    }

    .empty-state__icon svg {
      width: 20px;
      height: 20px;
    }

    .empty-state p {
      margin: 0;
      font-size: 0.86rem;
      line-height: 1.7;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(0, 0.88fr);
      gap: 18px;
      margin-top: 18px;
    }

    .panel {
      min-width: 0;
      padding: clamp(22px, 3vw, 28px);
      box-shadow: none;
    }

    .dashboard-grid .panel:first-child {
      background: #f4f8f9;
    }

    .panel-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 23px;
    }

    .panel-heading p {
      margin: 6px 0 0;
      color: var(--ink-faint);
      font-size: 0.75rem;
    }

    .weekly-chart {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 9px;
      height: 188px;
    }

    .chart-column {
      display: grid;
      grid-template-rows: 21px minmax(0, 1fr) 41px;
      gap: 7px;
      min-width: 0;
      text-align: center;
    }

    .chart-value {
      overflow: hidden;
      color: #526a78;
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chart-track {
      position: relative;
      width: min(100%, 28px);
      height: 100%;
      min-height: 78px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 6px;
      background: #e2e9e8;
    }

    .chart-fill {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 0;
      border-radius: 4px;
      background: linear-gradient(180deg, #72a0b5, var(--accent-deep));
      transition: height 260ms ease;
    }

    .chart-column.is-today .chart-track {
      box-shadow: 0 0 0 2px rgba(33, 75, 101, 0.16);
    }

    .chart-column.is-today .chart-label {
      color: var(--accent-deep);
      font-weight: 800;
    }

    .chart-label {
      align-self: start;
      color: var(--ink-faint);
      font-size: 0.65rem;
      line-height: 1.45;
      white-space: nowrap;
    }

    .chart-label span {
      display: block;
      color: var(--ink-soft);
      font-size: 0.59rem;
      font-weight: 700;
    }

    .history-list {
      display: grid;
      max-height: 344px;
      overflow: auto;
      scrollbar-color: #cbd3d0 transparent;
      scrollbar-width: thin;
    }

    .history-empty {
      display: grid;
      min-height: 164px;
      place-items: center;
      color: var(--ink-faint);
      font-size: 0.82rem;
      text-align: center;
    }

    .history-item {
      border-top: 1px solid #e2e6e3;
      background: transparent;
    }

    .history-item:first-child {
      border-top-color: var(--line-strong);
    }

    .history-toggle {
      display: grid;
      width: 100%;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      padding: 13px 0;
      border: 0;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .history-toggle:hover .history-date {
      color: var(--accent);
    }

    .history-date {
      overflow: hidden;
      font-size: 0.82rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-count {
      min-width: 36px;
      padding: 3px 7px;
      border: 1px solid #cfdce1;
      border-radius: 6px;
      color: var(--accent-deep);
      background: var(--surface-blue);
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      font-size: 0.66rem;
      font-weight: 700;
      text-align: center;
    }

    .history-chevron {
      width: 15px;
      height: 15px;
      color: var(--ink-faint);
      transition: transform 160ms ease;
    }

    .history-toggle[aria-expanded="true"] .history-chevron {
      transform: rotate(180deg);
    }

    .history-details {
      padding: 0 0 13px;
    }

    .history-detail-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 10px 0 0;
      border-top: 1px dashed #dfe4e1;
      list-style: none;
    }

    .history-detail-item {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 7px;
      color: var(--ink-soft);
      font-size: 0.76rem;
      line-height: 1.55;
    }

    .history-detail-mark {
      color: #a2aba7;
      font-weight: 800;
      text-align: center;
    }

    .history-detail-item.is-completed .history-detail-mark {
      color: var(--success);
    }

    .history-detail-item.is-completed .history-detail-text {
      color: var(--ink-faint);
      text-decoration: line-through;
    }

    .history-detail-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .app-footer {
      margin-top: 22px;
      color: var(--ink-faint);
      font-size: 0.72rem;
      line-height: 1.7;
      text-align: center;
    }

    .app-footer.is-warning {
      color: var(--danger);
      font-weight: 700;
    }

    .modal {
      width: min(calc(100% - 32px), 420px);
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 28px 70px rgba(21, 43, 55, 0.2);
    }

    .modal::backdrop {
      background: rgba(19, 39, 50, 0.4);
      backdrop-filter: blur(5px);
    }

    .modal-inner {
      padding: 27px;
    }

    .modal-icon {
      display: grid;
      width: 44px;
      height: 44px;
      margin-bottom: 17px;
      place-items: center;
      border: 1px solid #cfdee4;
      border-radius: 11px;
      color: var(--accent-deep);

<body>

  <div class="page-glow page-glow--two" aria-hidden="true"></div>

  <div class="app-shell">

  <dialog class="modal" id="rolloverDialog" aria-labelledby="rolloverTitle" aria-describedby="rolloverText">

  <dialog class="modal" id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
    <div class="modal-inner">
      <div class="modal-icon is-danger" id="confirmIcon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.6 2.2 18a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"></path>
        </svg>
      </div>

      <div class="modal-actions">
        <button class="button button--ghost" id="confirmCancel" type="button">取消</button>
        <button class="button button--danger" id="confirmOk" type="button">确认</button>
      </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      'use strict';

      const APP_ID = 'daily-checkin';
      const APP_VERSION = 1;
      const STORAGE_KEY = 'daily-checkin.v1';
      const MAX_TASK_LENGTH = 120;
      const MAX_IMPORT_BYTES = 5 * 1024 * 1024;

      const ICONS = {
        edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path></svg>',
        remove: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 15H6L5 6"></path><path d="M10 11v5M14 11v5"></path></svg>',
        chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>'
      };

      const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

      const elements = {};
      let state = createDefaultState();
      let storageAvailable = true;
      let activeDate = todayKey();
      let editingTaskId = null;
      let rolloverSourceDate = null;
      let toastTimer = null;
      let confirmResolver = null;
      const expandedHistory = new Set();

      function createDefaultState() {
        return {
          version: APP_VERSION,
          days: {},
          preferences: {
            lastRolloverPromptDate: null
          }
        };
      }

      function isPlainObject(value) {
        return Boolean(value) && typeof value === 'object' && !Array.isArray(value);
      }

      function pad(value) {
        return String(value).padStart(2, '0');
      }

      function dateKeyFromDate(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      function todayKey() {
        return dateKeyFromDate(new Date());
      }

      function dateFromKey(key) {
        const parts = key.split('-').map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
      }

      function isValidDateKey(key) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) {
          return false;
        }

        const [year, month, day] = key.split('-').map(Number);
        const date = new Date(year, month - 1, day, 12, 0, 0, 0);
        return date.getFullYear() === year
          && date.getMonth() === month - 1
          && date.getDate() === day;
      }

      function shiftDateKey(key, amount) {
        const date = dateFromKey(key);
        date.setDate(date.getDate() + amount);
        return dateKeyFromDate(date);
      }

      function formatFullDate(key) {
        const date = dateFromKey(key);
        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 · 星期${WEEKDAYS[date.getDay()]}`;
      }

      function formatShortDate(key) {
        const date = dateFromKey(key);
        return `${date.getMonth() + 1}月${date.getDate()}日`;
      }

      function formatHistoryDate(key) {
        const date = dateFromKey(key);
        const prefix = key === activeDate ? '今天 · ' : '';
        return `${prefix}${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 · 星期${WEEKDAYS[date.getDay()]}`;
      }

      function createTaskId() {
        if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
          return crypto.randomUUID();
        }
        return `task-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function createTask(text, completed = false, createdAt = new Date().toISOString()) {
        return {
          id: createTaskId(),
          text,
          completed,
          createdAt,
          completedAt: completed ? new Date().toISOString() : null
        };
      }

      function normalizeSavedTask(task) {
        if (!isPlainObject(task) || typeof task.text !== 'string') {
          return null;
        }

        const text = task.text.trim().slice(0, MAX_TASK_LENGTH);
        if (!text) {
          return null;
        }

        const completed = Boolean(task.completed);
        const createdAt = typeof task.createdAt === 'string' && task.createdAt
          ? task.createdAt
          : new Date().toISOString();

        return {
          id: typeof task.id === 'string' && task.id ? task.id : createTaskId(),
          text,
          completed,
          createdAt,
          completedAt: completed && typeof task.completedAt === 'string' ? task.completedAt : null
        };
      }

      function normalizeSavedState(value) {
        if (!isPlainObject(value) || value.version !== APP_VERSION || !isPlainObject(value.days)) {
          throw new Error('无法识别的数据格式');
        }

        const days = {};
        Object.entries(value.days).forEach(([key, day]) => {
          if (!isValidDateKey(key) || !isPlainObject(day) || !Array.isArray(day.tasks)) {
            return;
          }

          const tasks = day.tasks
            .map(normalizeSavedTask)
            .filter(Boolean);

          if (tasks.length > 0) {
            days[key] = { tasks };
          }
        });

        const promptDate = value.preferences && isValidDateKey(value.preferences.lastRolloverPromptDate)
          ? value.preferences.lastRolloverPromptDate
          : null;

        return {
          version: APP_VERSION,
          days,
          preferences: {
            lastRolloverPromptDate: promptDate
          }
        };
      }

      function validateBackup(rawText) {
        let root;

        try {
          root = JSON.parse(rawText);
        } catch {
          throw new Error('文件不是有效的 JSON 备份');
        }

        let payload = root;
        if (isPlainObject(root) && Object.prototype.hasOwnProperty.call(root, 'app')) {
          if (root.app !== APP_ID) {
            throw new Error('这个文件不属于“每日计划打卡”');
          }
          payload = root.data;
        }

        if (!isPlainObject(payload) || !isPlainObject(payload.days)) {
          throw new Error('备份缺少必要的 days 数据');
        }

        if (payload.version !== APP_VERSION) {
          throw new Error(`备份版本不兼容，仅支持版本 ${APP_VERSION}`);
        }

        const days = {};
        Object.entries(payload.days).forEach(([key, day]) => {
          if (!isValidDateKey(key)) {
            throw new Error(`备份中包含无效日期：${key}`);
          }
          if (!isPlainObject(day) || !Array.isArray(day.tasks)) {
            throw new Error(`${key} 的事项列表格式不正确`);
          }

          const seenIds = new Set();
          const tasks = day.tasks.map((task, index) => {
            if (!isPlainObject(task)) {
              throw new Error(`${key} 的第 ${index + 1} 项格式不正确`);
            }
            if (typeof task.id !== 'string' || !task.id) {
              throw new Error(`${key} 的第 ${index + 1} 项缺少有效 ID`);
            }
            if (seenIds.has(task.id)) {
              throw new Error(`${key} 的第 ${index + 1} 项 ID 重复`);
            }
            if (typeof task.text !== 'string') {
              throw new Error(`${key} 的第 ${index + 1} 项缺少文字内容`);
            }

            const text = task.text.trim();
            if (!text || text.length > MAX_TASK_LENGTH) {
              throw new Error(`${key} 的第 ${index + 1} 项文字长度无效`);
            }
            if (typeof task.completed !== 'boolean') {
              throw new Error(`${key} 的第 ${index + 1} 项缺少完成状态`);
            }

            seenIds.add(task.id);
            return {
              id: task.id,
              text,
              completed: task.completed,
              createdAt: typeof task.createdAt === 'string' && task.createdAt
                ? task.createdAt
                : new Date().toISOString(),
              completedAt: task.completed && typeof task.completedAt === 'string'
                ? task.completedAt
                : null
            };
          });

          if (tasks.length > 0) {
            days[key] = { tasks };
          }
        });

        const promptDate = payload.preferences
          && isValidDateKey(payload.preferences.lastRolloverPromptDate)
          ? payload.preferences.lastRolloverPromptDate
          : null;

        return {
          version: APP_VERSION,
          days,
          preferences: {
            lastRolloverPromptDate: promptDate
          }
        };
      }

      function canUseLocalStorage() {
        const testKey = '__daily_checkin_storage_test__';
        try {
          localStorage.setItem(testKey, '1');
          localStorage.removeItem(testKey);
          return true;
        } catch {
          return false;
        }
      }

      function loadSavedState() {
        if (!canUseLocalStorage()) {
          return {
            state: createDefaultState(),
            storageAvailable: false,
            notice: '当前浏览器禁止本地存储，本次记录会在刷新后丢失，请使用导出备份。'
          };
        }

        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return {
            state: createDefaultState(),
            storageAvailable: true,
            notice: ''
          };
        }

        try {
          return {
            state: normalizeSavedState(JSON.parse(raw)),
            storageAvailable: true,
            notice: ''
          };
        } catch {
          try {
            localStorage.setItem(`${STORAGE_KEY}.corrupt.${Date.now()}`, raw);
          } catch {
            // The app can still start in memory even if the recovery copy cannot be stored.
          }

          return {
            state: createDefaultState(),
            storageAvailable: true,
            notice: '原先的本地数据无法读取，已保留只读恢复副本并开启新记录。'
          };
        }
      }

      function saveState() {
        if (!storageAvailable) {
          return false;
        }

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return true;
        } catch {
          storageAvailable = false;
          updateStorageNotice();
          showToast('本地存储空间不可用，后续改动可能无法保存。', true, 5200);
          return false;
        }
      }

      function getDay(key, create = false) {
        if (!state.days[key] && create) {
          state.days[key] = { tasks: [] };
        }
        return state.days[key] || null;
      }

      function getTasks(key) {
        return getDay(key)?.tasks || [];
      }

      function getDayStats(key) {
        const tasks = getTasks(key);
        const completed = tasks.filter((task) => task.completed).length;
        return {
          total: tasks.length,
          completed,
          percent: tasks.length ? Math.round((completed / tasks.length) * 100) : 0
        };
      }

      function getRecordedDates() {
        return Object.keys(state.days)
          .filter((key) => getTasks(key).length > 0)
          .sort()
          .reverse();
      }

      function getStreak() {
        let cursor = activeDate;
        if (getDayStats(cursor).completed === 0) {
          cursor = shiftDateKey(cursor, -1);
        }

        let streak = 0;
        while (getDayStats(cursor).completed > 0) {
          streak += 1;
          cursor = shiftDateKey(cursor, -1);
        }
        return streak;
      }

      function element(tagName, className = '', text = '') {
        const node = document.createElement(tagName);
        if (className) {
          node.className = className;
        }
        if (text) {
          node.textContent = text;
        }
        return node;
      }

      function renderDate() {
        elements.dateLabel.textContent = formatFullDate(activeDate);
      }

      function renderSummary() {
        const stats = getDayStats(activeDate);
        const streak = getStreak();

        elements.summaryCompleted.textContent = String(stats.completed);
        elements.summaryTotal.textContent = String(stats.total);
        elements.summaryRate.textContent = `${stats.percent}%`;
        elements.summaryStreak.textContent = String(streak);
        elements.progressPercent.textContent = `${stats.percent}%`;
        elements.progressCaption.textContent = `已完成 ${stats.completed} / 共 ${stats.total} 项`;
        elements.progressFill.style.width = `${stats.percent}%`;
      }

      function createIconButton(label, icon, extraClass = '') {
        const button = element('button', `icon-button ${extraClass}`.trim());
        button.type = 'button';
        button.setAttribute('aria-label', label);
        button.title = label;
        button.innerHTML = icon;
        return button;
      }

      function renderTasks() {
        const tasks = getTasks(activeDate);
        elements.taskList.replaceChildren();
        elements.emptyToday.hidden = tasks.length > 0;
        elements.taskList.hidden = tasks.length === 0;

        tasks.forEach((task) => {
          const item = element('li', `task-item${task.completed ? ' is-completed' : ''}`);

          const checkLabel = element('label', 'task-check');
          const checkbox = element('input', 'task-checkbox');
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.setAttribute('aria-label', `${task.completed ? '标记为未完成' : '标记为完成'}：${task.text}`);
          checkbox.addEventListener('change', () => toggleTask(task.id));

          const checkmark = element('span', 'task-checkmark');
          checkmark.setAttribute('aria-hidden', 'true');
          checkLabel.append(checkbox, checkmark);

          if (editingTaskId === task.id) {
            const editInput = element('input', 'task-edit-input');
            editInput.type = 'text';
            editInput.maxLength = MAX_TASK_LENGTH;
            editInput.value = task.text;
            editInput.setAttribute('aria-label', '编辑计划事项');

            let editFinished = false;
            editInput.addEventListener('keydown', (event) => {
              if (event.key === 'Enter') {
                event.preventDefault();
                editFinished = true;
                commitTaskEdit(task.id, editInput.value);
              } else if (event.key === 'Escape') {
                event.preventDefault();
                editFinished = true;
                editingTaskId = null;
                renderTasks();
              }
            });
            editInput.addEventListener('blur', () => {
              if (!editFinished) {
                editFinished = true;
                commitTaskEdit(task.id, editInput.value);
              }
            });

            item.append(checkLabel, editInput);
            requestAnimationFrame(() => {
              editInput.focus();
              editInput.select();
            });
          } else {
            const text = element('span', 'task-text', task.text);
            const actions = element('div', 'task-actions');

            const editButton = createIconButton('编辑计划', ICONS.edit);
            editButton.addEventListener('click', () => {
              editingTaskId = task.id;
              renderTasks();
            });

            const deleteButton = createIconButton('删除计划', ICONS.remove, 'icon-button--danger');
            deleteButton.addEventListener('click', () => deleteTask(task.id));

            actions.append(editButton, deleteButton);
            item.append(checkLabel, text, actions);
          }

          elements.taskList.append(item);
        });
      }

      function renderWeeklyChart() {
        elements.weeklyChart.replaceChildren();
        const chartDescriptions = [];

        for (let offset = 6; offset >= 0; offset -= 1) {
          const key = shiftDateKey(activeDate, -offset);
          const date = dateFromKey(key);
          const stats = getDayStats(key);
          const column = element('div', `chart-column${key === activeDate ? ' is-today' : ''}`);
          const value = element('div', 'chart-value', stats.total ? `${stats.percent}%` : '—');

          const track = element('div', 'chart-track');
          track.setAttribute('aria-hidden', 'true');
          const fill = element('div', 'chart-fill');
          fill.style.height = `${stats.percent}%`;
          track.append(fill);

          const label = element('div', 'chart-label', WEEKDAYS[date.getDay()]);
          const count = element('span', '', stats.total ? `${stats.completed}/${stats.total}` : '无计划');
          label.append(count);

          column.append(value, track, label);
          column.title = stats.total
            ? `${formatShortDate(key)}：已完成 ${stats.completed} / ${stats.total}，完成率 ${stats.percent}%`
            : `${formatShortDate(key)}：暂无计划`;
          chartDescriptions.push(column.title);
          elements.weeklyChart.append(column);
        }

        elements.weeklyChart.setAttribute('aria-label', `最近 7 天完成率。${chartDescriptions.join('；')}。`);
      }

      function renderHistory() {
        const dates = getRecordedDates();
        elements.historyList.replaceChildren();

        if (dates.length === 0) {
          const empty = element('div', 'history-empty', '还没有历史记录\n添加并完成计划后会显示在这里');
          empty.style.whiteSpace = 'pre-line';
          elements.historyList.append(empty);
          return;
        }

        dates.forEach((key) => {
          const tasks = getTasks(key);
          const completed = tasks.filter((task) => task.completed).length;
          const isExpanded = expandedHistory.has(key);
          const item = element('div', 'history-item');
          const toggle = element('button', 'history-toggle');
          toggle.type = 'button';
          toggle.setAttribute('aria-expanded', String(isExpanded));
          toggle.setAttribute('aria-controls', `history-details-${key}`);

          const dateLabel = element('span', 'history-date', formatHistoryDate(key));
          const countLabel = element('span', 'history-count', `${completed}/${tasks.length}`);
          const chevron = element('span', 'history-chevron');
          chevron.innerHTML = ICONS.chevron;
          toggle.append(dateLabel, countLabel, chevron);

          const details = element('div', 'history-details');
          details.id = `history-details-${key}`;
          details.hidden = !isExpanded;

          const detailList = element('ul', 'history-detail-list');
          tasks.forEach((task) => {
            const detailItem = element('li', `history-detail-item${task.completed ? ' is-completed' : ''}`);
            const mark = element('span', 'history-detail-mark', task.completed ? '✓' : '○');
            const text = element('span', 'history-detail-text', task.text);
            detailItem.append(mark, text);
            detailList.append(detailItem);
          });
          details.append(detailList);

          toggle.addEventListener('click', () => {
            const nextExpanded = toggle.getAttribute('aria-expanded') !== 'true';
            toggle.setAttribute('aria-expanded', String(nextExpanded));
            details.hidden = !nextExpanded;
            if (nextExpanded) {
              expandedHistory.add(key);
            } else {
              expandedHistory.delete(key);
            }
          });

          item.append(toggle, details);
          elements.historyList.append(item);
        });
      }

      function render() {
        renderDate();
        renderSummary();
        renderTasks();
        renderWeeklyChart();
        renderHistory();
      }

      function findTask(id, key = activeDate) {
        return getTasks(key).find((task) => task.id === id) || null;
      }

      function toggleTask(id) {
        const task = findTask(id);
        if (!task) {
          return;
        }

        task.completed = !task.completed;
        task.completedAt = task.completed ? new Date().toISOString() : null;
        saveState();
        render();
      }

      function commitTaskEdit(id, rawValue) {
        const task = findTask(id);
        if (!task) {
          editingTaskId = null;
          renderTasks();
          return;
        }

        const text = rawValue.trim();
        if (!text) {
          editingTaskId = null;
          renderTasks();
          showToast('计划内容不能为空，已取消本次编辑。', true);
          return;
        }

        task.text = text.slice(0, MAX_TASK_LENGTH);
        editingTaskId = null;
        saveState();
        render();
      }

      async function deleteTask(id) {
        const task = findTask(id);
        if (!task) {
          return;
        }

        const confirmed = await askConfirm({
          title: '删除这条计划？',
          message: `“${task.text}”将从今日清单中移除，此操作无法撤销。`,
          confirmText: '删除'
        });

        if (!confirmed) {
          return;
        }

        const day = getDay(activeDate);
        if (!day) {
          return;
        }
        day.tasks = day.tasks.filter((item) => item.id !== id);
        if (day.tasks.length === 0) {
          delete state.days[activeDate];
        }
        editingTaskId = null;
        saveState();
        render();
        showToast('计划已删除。');
      }

      function addTask(text) {
        const value = text.trim();
        if (!value) {
          showToast('先写下要做的事情。', true);
          elements.taskInput.focus();
          return;
        }

        const day = getDay(activeDate, true);
        day.tasks.push(createTask(value.slice(0, MAX_TASK_LENGTH)));
        saveState();
        elements.taskInput.value = '';
        render();
        elements.taskInput.focus();
      }

      function updateStorageNotice() {
        if (storageAvailable) {
          elements.appFooter.classList.remove('is-warning');
          elements.storageNotice.textContent = '数据仅保存在此浏览器中 · 建议定期导出备份';
        } else {
          elements.appFooter.classList.add('is-warning');
          elements.storageNotice.textContent = '本地存储不可用：本次数据会在刷新后丢失，请立即导出备份。';
        }
      }

      function showToast(message, isError = false, duration = 2800) {
        window.clearTimeout(toastTimer);
        elements.toast.textContent = message;
        elements.toast.classList.toggle('is-error', isError);
        elements.toast.classList.add('is-visible');
        toastTimer = window.setTimeout(() => {
          elements.toast.classList.remove('is-visible');
        }, duration);
      }

      function markRolloverHandled() {
        state.preferences.lastRolloverPromptDate = activeDate;
        saveState();
      }

      function findRolloverSource() {
        const previousDates = getRecordedDates().filter((key) => key < activeDate);
        if (previousDates.length === 0) {
          return null;
        }

        const previousKey = previousDates[0];
        const unfinished = getTasks(previousKey).filter((task) => !task.completed);
        return unfinished.length > 0 ? { key: previousKey, tasks: unfinished } : null;
      }

      function maybePromptRollover() {
        if (state.preferences.lastRolloverPromptDate === activeDate) {
          return;
        }

        const source = findRolloverSource();
        if (!source) {
          markRolloverHandled();
          return;
        }

        rolloverSourceDate = source.key;
        const count = source.tasks.length;
        elements.rolloverText.textContent = `${formatShortDate(source.key)}还有 ${count} 项未完成。带入后会复制到今天并重置为未完成，原历史记录不会被修改。`;

        if (!elements.rolloverDialog.open) {
          elements.rolloverDialog.showModal();
        }
      }

      function acceptRollover() {
        if (!rolloverSourceDate) {
          markRolloverHandled();
          elements.rolloverDialog.close();
          return;
        }

        const sourceTasks = getTasks(rolloverSourceDate).filter((task) => !task.completed);
        const target = getDay(activeDate, true);
        sourceTasks.forEach((task) => {
          target.tasks.push(createTask(task.text));
        });

        markRolloverHandled();
        rolloverSourceDate = null;
        elements.rolloverDialog.close();
        render();
        showToast(`已将 ${sourceTasks.length} 项未完成计划带入今天。`);
      }

      function declineRollover() {
        rolloverSourceDate = null;
        markRolloverHandled();
        if (elements.rolloverDialog.open) {
          elements.rolloverDialog.close();
        }
      }

      function syncDate() {
        const currentDate = todayKey();
        if (currentDate !== activeDate) {
          activeDate = currentDate;
          editingTaskId = null;
          rolloverSourceDate = null;
          render();
        }
        maybePromptRollover();
      }

      function askConfirm({ title, message, confirmText = '确认' }) {
        if (confirmResolver) {
          confirmResolver(false);
          confirmResolver = null;
        }

        elements.confirmTitle.textContent = title;
        elements.confirmMessage.textContent = message;
        elements.confirmOk.textContent = confirmText;
        elements.confirmDialog.showModal();

        return new Promise((resolve) => {
          confirmResolver = resolve;
        });
      }

      function finishConfirm(result) {
        if (elements.confirmDialog.open) {
          elements.confirmDialog.close();
        }
        if (confirmResolver) {
          const resolve = confirmResolver;
          confirmResolver = null;
          resolve(result);
        }
      }

      function exportBackup() {
        const payload = {
          app: APP_ID,
          version: APP_VERSION,
          exportedAt: new Date().toISOString(),
          data: state
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = `plan-checkin-backup-${todayKey()}.json`;
        document.body.append(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
        showToast('备份文件已导出。');
      }

      async function importBackup(file) {
        if (!file) {
          return;
        }

        if (file.size > MAX_IMPORT_BYTES) {
          throw new Error('备份文件超过 5 MB，无法导入');
        }

        const rawText = await file.text();
        const importedState = validateBackup(rawText);
        const dayCount = Object.keys(importedState.days).length;
        const confirmed = await askConfirm({
          title: '用备份替换本地数据？',
          message: `备份中包含 ${dayCount} 天记录。导入后会替换当前浏览器中的全部计划，建议先导出当前数据。`,
          confirmText: '导入并替换'
        });

        if (!confirmed) {
          showToast('已取消导入，本地数据未改变。');
          return;
        }

        state = importedState;
        if (!state.preferences.lastRolloverPromptDate) {
          state.preferences.lastRolloverPromptDate = activeDate;
        }
        editingTaskId = null;
        rolloverSourceDate = null;
        expandedHistory.clear();
        saveState();
        render();
        showToast(storageAvailable ? '备份已成功导入。' : '备份已载入，但当前浏览器仍无法持久保存。', !storageAvailable, 4200);
      }

      function bindEvents() {
        elements.addTaskForm.addEventListener('submit', (event) => {
          event.preventDefault();
          addTask(elements.taskInput.value);
        });

        elements.exportButton.addEventListener('click', exportBackup);

        elements.importInput.addEventListener('change', async () => {
          const file = elements.importInput.files?.[0];
          try {
            await importBackup(file);
          } catch (error) {
            showToast(error instanceof Error ? error.message : '导入失败，请检查备份文件。', true, 4200);
          } finally {
            elements.importInput.value = '';
          }
        });

        elements.acceptRollover.addEventListener('click', acceptRollover);
        elements.declineRollover.addEventListener('click', declineRollover);

        elements.rolloverDialog.addEventListener('cancel', (event) => {
          event.preventDefault();
          declineRollover();
        });

        elements.confirmCancel.addEventListener('click', () => finishConfirm(false));
        elements.confirmOk.addEventListener('click', () => finishConfirm(true));
        elements.confirmDialog.addEventListener('cancel', (event) => {
          event.preventDefault();
          finishConfirm(false);
        });

        window.addEventListener('focus', syncDate);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) {
            syncDate();
          }
        });
        window.setInterval(syncDate, 60000);
      }

      function cacheElements() {
        const ids = [
          'dateLabel', 'summaryCompleted', 'summaryTotal', 'summaryRate', 'summaryStreak',
          'progressPercent', 'progressCaption', 'progressFill', 'addTaskForm', 'taskInput',
          'taskList', 'emptyToday', 'weeklyChart', 'historyList', 'exportButton', 'importInput',
          'rolloverDialog', 'rolloverText', 'acceptRollover', 'declineRollover',
          'confirmDialog', 'confirmTitle', 'confirmMessage', 'confirmCancel', 'confirmOk',
          'toast', 'appFooter', 'storageNotice'
        ];

        ids.forEach((id) => {
          elements[id] = document.getElementById(id);
        });
      }

      function init() {
        cacheElements();
        const loaded = loadSavedState();
        state = loaded.state;
        storageAvailable = loaded.storageAvailable;
        activeDate = todayKey();
        bindEvents();
        render();
        updateStorageNotice();

        if (loaded.notice) {
          showToast(loaded.notice, !storageAvailable, 5200);
        }

        window.setTimeout(maybePromptRollover, 0);
      }

      init();
    })();
  </script>
</body>
</html>
